name: monster-arena

services:
  app:
    build:
      context: .
      target: development
    command: pnpm dev
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      app:
        condition: service_started
    environment:
      PLAYWRIGHT_BASE_URL: http://app:5173
    ipc: host
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules

  production:
    profiles: [production]
    build:
      context: .
      target: production
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - '4173:8080'

volumes:
  app_node_modules:
  e2e_node_modules:
