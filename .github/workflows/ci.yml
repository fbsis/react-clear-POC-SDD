name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run format, lint, types, tests and production build in Docker
        run: docker build --target quality --tag monster-arena-quality:${{ github.sha }} .

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start application in Docker
        run: docker compose up --detach --build app

      - name: Run Playwright in Docker
        run: docker compose run --rm --build e2e pnpm test:e2e

      - name: Print application logs on failure
        if: failure()
        run: docker compose logs app

      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes
